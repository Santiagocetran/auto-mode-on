[project]
name = "halketon-api"
version = "0.1.0"
description = "Halketon FastAPI backend — WhatsApp capture, reminders, meeting extraction"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "twilio>=9.0",
    "openai>=1.30",
    "supabase>=2.5",
    "python-multipart>=0.0.9",  # Twilio posts form-encoded webhook bodies
    "httpx>=0.27",              # download Twilio media for transcription
    "imageio-ffmpeg>=0.5",      # bundled ffmpeg for audio→mp3 transcode
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",  # FastAPI TestClient
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
